<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a [routerLink]="'/'" class="navbar-brand">Animal Aid Platform</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      @if (checkAuthenticated()) {
      <div class="me-auto mb-2 mb-lg-0">
        <button mat-button [routerLink]="'/admin'">Admin</button>
      </div>
      <form class="d-flex" role="search">
        <input
          class="form-control me-2 searchForm"
          type="search"
          placeholder="Keresés"
          aria-label="Keresés"
          [(ngModel)]="searchTerm"
          (ngModelChange)="filterResults()"
          name="searchTerm"
          (focus)="onFocus()"
        />
        <button class="btn btn-outline-success searchForm" type="submit">Keresés</button>
        <div *ngIf="showResults && (filteredPosts.length || filteredShelters.length) && searchTerm != ''" class="search-results">
          <div *ngIf="filteredPosts.length">
            <h5>Posztok</h5>
            <ul>
              <li *ngFor="let post of filteredPosts">
                <a (click)="navigateToPost(post.id!)" style="cursor: pointer;">{{ post.title }} - {{ post.creatorName }}</a>
              </li>
            </ul>
          </div>
          <hr *ngIf="filteredPosts.length && filteredShelters.length" />
          <div *ngIf="filteredShelters.length">
            <h5>Shelterek</h5>
            <ul>
              <li *ngFor="let shelter of filteredShelters">
                <a (click)="navigateToShelter(shelter.id!)" style="cursor: pointer;">{{ shelter.name }} - {{ shelter.contactName }}</a>
              </li>
            </ul>
          </div>
        </div>
        <div
          class="overlay"
          *ngIf="showResults"
          (click)="showResults = false"
        ></div>
      </form>

      <button
        mat-fab
        class="mdc-fab mdc-fab--extended ms-auto mb-2 mb-lg-0"
        [matMenuTriggerFor]="profileMenu"
        color="#ffff"
      >
        <div class="mdc-fab__ripple"></div>
        <span class="material-icons mdc-fab__icon">person</span>
        <span class="mdc-fab__label">{{ this.name }}</span>
      </button>

      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item [routerLink]="'/profile/notification-settings'">
          <mat-icon>notifications</mat-icon> Értesítések beállítása
        </button>
        <button mat-menu-item [routerLink]="'/profile/owned-animals'">
          <mat-icon>pets</mat-icon> Állataink
        </button>
        <button mat-menu-item [routerLink]="'/profile'">
          <mat-icon>settings</mat-icon> Profil szerkesztése
        </button>
        <button mat-menu-item (click)="this.authService.logout()">
          <mat-icon>logout</mat-icon> Kijelentkezés
        </button>
      </mat-menu>
      }
    </div>
  </div>
</nav>
